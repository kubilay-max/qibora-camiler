name: Camileri topla

on:
  schedule:
    - cron: '17 2 3 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Overpass'tan topla
        run: python scripts/topla.py
      - name: Değişiklikleri kaydet
        run: |
          git config user.name "qibora-bot"
          git config user.email "miswakapp@gmail.com"
          git add -A t bilgi.json
          git commit -m "Cami verisi güncellendi ($(date +%Y-%m-%d))" || echo "Değişiklik yok"
          git push
