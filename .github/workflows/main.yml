name: Camileri topla

# Camiler (t/) ve helal yemek yerleri (h/)
on:
  schedule:
    - cron: '17 2 * * *'   # her gün 02:17 UTC; o ayın verisi tamamsa betik hemen çıkar
  workflow_dispatch: {}     # Actions sekmesinden elle başlatmak için

permissions:
  contents: write

concurrency:
  group: camiler
  cancel-in-progress: false

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 340    # betik 300. dakikada kendisi durur
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: osmium kur
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - name: Ay
        id: ay
        run: echo "ay=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Biten bölgeleri geri yükle
        uses: actions/cache/restore@v4
        with:
          path: parca2
          key: parca2-${{ steps.ay.outputs.ay }}-${{ github.run_id }}
          restore-keys: parca2-${{ steps.ay.outputs.ay }}-
      - name: Camileri topla
        run: python scripts/topla.py
      - name: Biten bölgeleri sakla
        if: always()
        uses: actions/cache/save@v4
        with:
          path: parca2
          key: parca2-${{ steps.ay.outputs.ay }}-${{ github.run_id }}
      - name: Kaydet
        run: |
          git config user.name "qibora-bot"
          git config user.email "miswakapp@gmail.com"
          git add -A t bilgi.json
          if [ -d h ]; then git add -A h; fi
          git rm -q --cached --ignore-unmatch durum.json
          git commit -m "Cami verisi ($(date +%Y-%m-%d))" || echo "Değişiklik yok"
          git push
